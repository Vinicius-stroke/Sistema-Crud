<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Cliente - Servidor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/form.css">
</head>
<body>

    <div class="container py-5">
        <div class="card shadow-lg form-card">
            <div class="card-body p-5">

                <h3 class="text-center mb-4">
                    Cadastro Cliente - Servidor
                </h3>

                <form method="post" action="#">

                    <div class="row">
                        <!-- Nome -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nome do Cliente</label>
                            <input type="text" id="nome" class="form-control" required>
                        </div>

                        <!-- CPF / CNPJ -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CPF / CNPJ</label>
                            <input type="text" id="cpf" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Email -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <!-- Telefone -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefone</label>
                            <input type="tel" id="telefone" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <!-- Tipo de Serviço -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tipo de Serviço</label>
                            <select class="form-select" id="servico" required>
                                <option value="">Selecione</option>
                                <option>Hospedagem</option>
                                <option>Servidor Dedicado</option>
                                <option>Servidor em Nuvem</option>
                                <option>Suporte Técnico</option>
                            </select>
                        </div>

                        <!-- Status -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status do Cliente</label>
                            <select class="form-select" id="status" required>
                                <option value="">Selecione</option>
                                <option>Ativo</option>
                                <option>Pendente</option>
                                <option>Em análise</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Servidor -->
                        <div class="col-md-6 mb-4">
                            <label class="form-label">Servidor Associado</label>
                            <select class="form-select" id="servidor" required>
                                <option value="">Selecione</option>
                                <option>Servidor 01</option>
                                <option>Servidor 02</option>
                                <option>Servidor 03</option>
                            </select>
                        </div>

                        <!-- Plano -->
                        <div class="col-md-6 mb-4">
                            <label class="form-label">Plano</label>
                            <select class="form-select" id="plano" required>
                                <option value="">Selecione</option>
                                <option>Básico</option>
                                <option>Profissional</option>
                                <option>Corporativo</option>
                            </select>
                        </div>
                    </div>

                    <!-- Botões -->
                    <div class="d-flex justify-content-end gap-3">
                        <button type="button" class="btn btn-outline-secondary" id="btnLimpar">
                            Limpar
                        </button>
                        <button type="submit" class="btn btn-primary" id="btnSalvar">
                            Salvar Cliente
                        </button>
                        <button type="button" class="btn btn-primary" id="btnSeguinte">
                            Seguinte >>
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <div class="text-center mt-4">
            <small class="text-muted">
                © 2026 - Sistema Cliente-Servidor Corporativo
            </small>
        </div>
    </div>
<script src="/src/script/form.js"></script>
</body>
</html>
