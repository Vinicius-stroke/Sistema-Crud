<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | Sistema Corporativo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg p-4">
            
            <div class="text-center mb-4">
                <div class="logo">Sistema Corporativo</div>
                <p class="text-muted mt-2">Crie sua conta para continuar</p>
            </div>

            <form>
                <div class="mb-3">
                    <label for="nome" class="form-label" >Nome Completo</label>
                    <input type="text" id="nome" class="form-control" placeholder="Digite seu nome">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="Digite seu E-mail">
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">
                </div>

                <div class="mb-3">
                    <label for="confirmar" class="form-label">Confirmar Senha</label>
                    <input type="password" id="confirmar" class="form-control" placeholder="Confirme sua senha">
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary" id="btn">
                        Criar Conta
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <span class="text-muted">Já possui conta?</span>
                <a href="login.html" class="text-decoration-none fw-semibold">Entrar</a>
            </div>

        </div>
    </div>
</div>
<script src="/src/script/script.js"></script>
</body>
</html>
