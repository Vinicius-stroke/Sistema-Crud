<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS opcional (caso queira reaproveitar o estilo do login) -->
    <link rel="stylesheet" href="/src/css/login.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">
            
            <h4 class="text-center mb-3">Recuperar Senha</h4>
            <p class="text-center text-muted small mb-4">
                Informe seu e-mail cadastrado para receber as instruções de redefinição de senha.
            </p>

            <form method="post" action="#">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">
                        Enviar instruções
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a href="login.html" class="text-decoration-none">
                    ← Voltar para o login
                </a>
            </div>

            <div class="text-center mt-3">
                <small class="text-muted">
                    © 2026 - Sistema Corporativo
                </small>
            </div>

        </div>
    </div>

</body>
</html>
