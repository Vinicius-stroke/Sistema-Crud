<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Servidor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/lista.css">

</head>
<body>

    <div class="container py-5">

        <div class="card shadow-lg">
            <div class="card-body p-4">

                <h3 class="mb-4 text-center text-primary">
                    Clientes Cadastrados
                </h3>

                <!-- FILTRO (APENAS VISUAL) -->
                <form class="row g-3 mb-4">
                    <div class="col-md-4">
                        <select class="form-select" id="filtroServico">
                            <option value="">Todos os serviços</option>
                            <option value="Hospedagem">Hospedagem</option>
                            <option value="Servidor Dedicado">Servidor Dedicado</option>
                            <option value="Servidor em Nuvem">Servidor em Nuvem</option>
                            <option value="Suporte Técnico">Suporte Técnico</option>
                        </select>

                    </div>

                    <div class="col-md-4">
                       <select class="form-select" id="filtroStatus">
                            <option value="">Todos os status</option>
                            <option value="Ativo">Ativo</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Em análise">Em análise</option>
                        </select>

                    </div>

                    <div class="col-md-4">
                        <select class="form-select" id="filtroServidor">
                            <option value="">Todos os servidores</option>
                            <option value="Servidor 01">Servidor 01</option>
                            <option value="Servidor 02">Servidor 02</option>
                            <option value="Servidor 03">Servidor 03</option>
                        </select>

                    </div>
                </form>

                <!-- TABELA (DADOS VIRÃO DO LOCALSTORAGE FUTURAMENTE) -->
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Cliente</th>
                                <th>Email</th>
                                <th>CPF</th>
                                <th>Serviço</th>
                                <th>Servidor</th>
                                <th>Status</th>
                                <th>Plano</th>
                            </tr>
                        </thead>
                        <tbody id="resultado">
                       
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <div class="text-center mt-4">
            <small class="text-light">
                © 2026 - Sistema Cliente-Servidor Corporativo
            </small>
        </div>

    </div>
<script src="/src/script/lista.js"></script>
</body>
</html>
