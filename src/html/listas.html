<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Servidor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(
                rgba(0, 40, 90, 0.75),
                rgba(0, 40, 90, 0.75)
            ),
            url("https://images.unsplash.com/photo-1518770660439-4636190af475");
            background-size: cover;
            background-position: center;
        }

        .card {
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container py-5">

        <div class="card shadow-lg">
            <div class="card-body p-4">

                <h3 class="mb-4 text-center text-primary">
                    Clientes Cadastrados
                </h3>

                <!-- FILTRO (APENAS VISUAL) -->
                <form class="row g-3 mb-4">
                    <div class="col-md-4">
                        <select class="form-select">
                            <option>Serviço</option>
                            <option>Hospedagem</option>
                            <option>Servidor Dedicado</option>
                            <option>Servidor em Nuvem</option>
                            <option>Suporte Técnico</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <select class="form-select">
                            <option>Status</option>
                            <option>Ativo</option>
                            <option>Pendente</option>
                            <option>Em análise</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <select class="form-select">
                            <option>Servidor</option>
                            <option>Servidor 01</option>
                            <option>Servidor 02</option>
                            <option>Servidor 03</option>
                        </select>
                    </div>
                </form>

                <!-- TABELA (DADOS VIRÃO DO LOCALSTORAGE FUTURAMENTE) -->
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Cliente</th>
                                <th>Email</th>
                                <th>CPF</th>
                                <th>Serviço</th>
                                <th>Servidor</th>
                                <th>Status</th>
                                <th>Plano</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- EXEMPLO VISUAL -->
                            <tr>
                                <td>João Silva</td>
                                <td>joao@email.com</td>
                                <td>123.456.789-00</td>
                                <td>Servidor em Nuvem</td>
                                <td>Servidor 01</td>
                                <td>
                                    <span class="badge bg-success">Ativo</span>
                                </td>
                                <td>Profissional</td>
                            </tr>

                            <tr>
                                <td>Empresa Alpha</td>
                                <td>contato@alpha.com</td>
                                <td>987.654.321-00</td>
                                <td>Hospedagem</td>
                                <td>Servidor 02</td>
                                <td>
                                    <span class="badge bg-warning text-dark">Pendente</span>
                                </td>
                                <td>Corporativo</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <div class="text-center mt-4">
            <small class="text-light">
                © 2026 - Sistema Cliente-Servidor Corporativo
            </small>
        </div>

    </div>

</body>
</html>
