<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/src/css/login.css">
</head>
<body>

    <div class="card shadow login-card">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Acesso ao Sistema</h3>

            <form method="post" action="#">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary" id="btnLogin">
                        Entrar
                    </button>
                </div>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">
                    © 2026 - Sistema Corporativo
                </small>
            </div>
        </div>
    </div>
    <script src="/src/script/login.js"></script>
</body>
</html>
